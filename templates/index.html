<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BSE Filings — Corporate Announcements</title>
<style>
  :root{
    --bg:#eef1f4;
    --panel:#ffffff;
    --ink:#161b22;
    --muted:#5b6672;
    --line:#dce1e7;
    --accent:#0e5c63;      /* exchange teal */
    --accent-ink:#0a464b;
    --doc:#b0691a;         /* stamped-paper amber for PDFs */
    --doc-bg:#fbf2e4;
    --live:#1c8a4a;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--accent-ink);}

  /* ---- header ---- */
  header{
    position:sticky;top:0;z-index:10;
    background:var(--panel);
    border-bottom:1px solid var(--line);
  }
  .bar{max-width:920px;margin:0 auto;padding:14px 20px;}
  .brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
  .brand h1{
    font-size:18px;font-weight:700;margin:0;letter-spacing:-.01em;
  }
  .brand .sub{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;}
  .status{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--live);box-shadow:0 0 0 3px rgba(28,138,74,.15);}

  .controls{
    max-width:920px;margin:0 auto;padding:0 20px 16px;
    display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:end;
  }
  .field{display:flex;flex-direction:column;gap:4px;min-width:0;}
  .field label{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
  .field input{
    font-family:var(--sans);font-size:14px;color:var(--ink);
    padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:#fff;width:100%;
  }
  .field input[type=date]{font-family:var(--mono);font-size:12.5px;}
  .field input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent);}
  button.go{
    font-family:var(--sans);font-size:14px;font-weight:600;color:#fff;background:var(--accent);
    border:none;border-radius:7px;padding:10px 18px;cursor:pointer;white-space:nowrap;
  }
  button.go:hover{background:var(--accent-ink);}
  button.go:disabled{opacity:.55;cursor:progress;}

  /* ---- main ---- */
  main{max-width:920px;margin:0 auto;padding:20px;}

  .company{
    display:none;align-items:baseline;gap:14px;flex-wrap:wrap;
    padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:14px;
  }
  .company.show{display:flex;}
  .company .name{font-size:16px;font-weight:700;}
  .company .meta{font-family:var(--mono);font-size:12px;color:var(--muted);}
  .company .meta b{color:var(--accent-ink);font-weight:600;}
  .company .n{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--muted);}

  /* ---- filing cards ---- */
  .feed{display:flex;flex-direction:column;gap:10px;}
  .card{
    position:relative;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:14px 16px 14px 18px;overflow:hidden;
  }
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--rule,var(--accent));}
  .card .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px;}
  .chip{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;text-transform:uppercase;
    padding:2px 8px;border-radius:999px;background:#eef2f4;color:var(--accent-ink);border:1px solid var(--line);
  }
  .time{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-left:auto;}
  .subject{font-size:14.5px;font-weight:600;letter-spacing:-.005em;margin:2px 0;}
  .headline{font-size:13px;color:var(--muted);margin:2px 0 0;}
  .foot{display:flex;align-items:center;gap:10px;margin-top:11px;flex-wrap:wrap;}
  .pdf{
    display:inline-flex;align-items:center;gap:7px;text-decoration:none;
    font-family:var(--mono);font-size:12px;font-weight:600;color:var(--doc);
    background:var(--doc-bg);border:1px solid #ecdcc2;padding:6px 11px;border-radius:7px;
  }
  .pdf:hover{background:#f6e8d1;}
  .pdf .sz{color:#a98a5b;font-weight:400;}
  .nopdf{font-family:var(--mono);font-size:11.5px;color:#9aa4ad;}
  .detail{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-decoration:none;margin-left:auto;}
  .detail:hover{color:var(--accent-ink);text-decoration:underline;}

  /* ---- states ---- */
  .state{
    text-align:center;padding:56px 24px;color:var(--muted);
    background:var(--panel);border:1px dashed var(--line);border-radius:10px;
  }
  .state h2{font-size:15px;font-weight:600;color:var(--ink);margin:0 0 6px;}
  .state p{margin:0;font-size:13.5px;}
  .state.err{border-color:#e6b8b8;background:#fdf4f4;color:#8a3a3a;}
  .state.err h2{color:#8a3a3a;}

  @media(max-width:640px){
    .controls{grid-template-columns:1fr 1fr;}
    .controls .field.company-field{grid-column:1 / -1;}
    button.go{grid-column:1 / -1;}
    .status{display:none;}
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">
      <h1>BSE Filings</h1>
      <span class="sub">Corporate Announcements</span>
      <span class="status"><span class="dot"></span> live from BSE feed</span>
    </div>
  </div>
  <div class="controls">
    <div class="field company-field">
      <label for="q">Company / symbol / ISIN / code</label>
      <input id="q" type="text" placeholder="e.g. Axis Bank, HDFCBANK, INE238A01034, 532215" autocomplete="off">
    </div>
    <div class="field">
      <label for="from">From</label>
      <input id="from" type="date">
    </div>
    <div class="field">
      <label for="to">To</label>
      <input id="to" type="date">
    </div>
    <button class="go" id="go">Fetch</button>
  </div>
</header>

<main>
  <div class="company" id="company">
    <span class="name" id="cName">—</span>
    <span class="meta">code <b id="cCode">—</b></span>
    <span class="meta" id="cIsinWrap">isin <b id="cIsin">—</b></span>
    <span class="n" id="cCount"></span>
  </div>

  <div id="feed" class="feed"></div>

  <div class="state" id="state">
    <h2>Search a company to begin</h2>
    <p>Type a name, ticker, ISIN or BSE scrip code, pick a date range, and hit Fetch.</p>
  </div>
</main>

<script>
  const $ = id => document.getElementById(id);
  const feed = $('feed'), state = $('state'), company = $('company'), goBtn = $('go');

  // default window: last 30 days
  (function initDates(){
    const to = new Date(), from = new Date(); from.setDate(from.getDate()-30);
    const iso = d => d.toISOString().slice(0,10);
    $('to').value = iso(to); $('from').value = iso(from);
  })();

  // give each category a stable left-rule colour
  const RULE = ["#0e5c63","#7a4fb0","#b0691a","#2f7d3a","#b03a4f","#3a5db0","#5b6672"];
  const ruleFor = c => RULE[[...(c||"General")].reduce((a,ch)=>a+ch.charCodeAt(0),0) % RULE.length];

  const fmtDate = s => {
    if(!s) return "—";
    const d = new Date(s);
    if(isNaN(d)) return s;
    return d.toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true});
  };
  const esc = s => (s||"").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  function showState(title, msg, isErr){
    feed.innerHTML = "";
    state.style.display = "block";
    state.className = "state" + (isErr ? " err" : "");
    state.innerHTML = `<h2>${esc(title)}</h2><p>${esc(msg)}</p>`;
  }

  function renderCompany(info, count, total){
    company.classList.add('show');
    $('cName').textContent = info.company_name || info.symbol || "Company";
    $('cCode').textContent = info.bse_code || "—";
    if(info.isin){ $('cIsin').textContent = info.isin; $('cIsinWrap').style.display=""; }
    else { $('cIsinWrap').style.display="none"; }
    const more = (total && total > count) ? ` of ${total}` : "";
    $('cCount').textContent = `${count} filing${count===1?"":"s"}${more}`;
  }

  function renderFeed(items){
    if(!items.length){
      showState("No filings in this window", "This company has no announcements in the selected date range. Try widening the dates.");
      return;
    }
    state.style.display = "none";
    feed.innerHTML = items.map(a => {
      const cat = a.category || a.subcategory || "General";
      const pdf = a.pdf_url
        ? `<a class="pdf" href="${esc(a.pdf_url)}" target="_blank" rel="noopener">↧ PDF${a.attach_size_kb?` <span class="sz">${a.attach_size_kb} KB</span>`:""}</a>`
        : `<span class="nopdf">no attachment</span>`;
      const detail = a.detail_url ? `<a class="detail" href="${esc(a.detail_url)}" target="_blank" rel="noopener">stock page →</a>` : "";
      const headline = (a.headline && a.headline !== a.subject) ? `<p class="headline">${esc(a.headline)}</p>` : "";
      return `<article class="card" style="--rule:${ruleFor(cat)}">
        <div class="top">
          <span class="chip">${esc(cat)}</span>
          <span class="time">${esc(fmtDate(a.date))}</span>
        </div>
        <div class="subject">${esc(a.subject || a.headline || "(no subject)")}</div>
        ${headline}
        <div class="foot">${pdf}${detail}</div>
      </article>`;
    }).join("");
  }

  async function run(){
    const q = $('q').value.trim();
    if(!q){ $('q').focus(); return; }
    goBtn.disabled = true; goBtn.textContent = "Fetching…";
    company.classList.remove('show');
    showState("Looking up company…", "Resolving “"+q+"” against the BSE scrip master.");
    try{
      const s = await fetch('/api/search?q='+encodeURIComponent(q)).then(r=>r.json().then(j=>({ok:r.ok,j})));
      if(!s.ok){ showState("Couldn’t find that company", s.j.error || "No match.", true); return; }
      const info = s.j;

      showState("Fetching filings…", "Pulling announcements for "+(info.company_name||info.bse_code)+".");
      const url = `/api/announcements?code=${encodeURIComponent(info.bse_code)}&from=${$('from').value}&to=${$('to').value}`;
      const a = await fetch(url).then(r=>r.json().then(j=>({ok:r.ok,j})));
      if(!a.ok){ showState("Couldn’t load filings", a.j.error || "Request failed.", true); return; }

      renderCompany(info, a.j.count, a.j.total_available);
      renderFeed(a.j.announcements);
    }catch(e){
      showState("Something went wrong", "Is the backend running? "+e.message, true);
    }finally{
      goBtn.disabled = false; goBtn.textContent = "Fetch";
    }
  }

  goBtn.addEventListener('click', run);
  $('q').addEventListener('keydown', e => { if(e.key==='Enter') run(); });
</script>
</body>
</html>
